name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  draft:
    name: Prepare draft release
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
      - name: Validate tag and build release assets
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python scripts/release.py check --tag "$TAG"
          python scripts/release.py build --tag "$TAG"
          (cd dist && sha256sum --check SHA256SUMS)
      - name: Create or update the draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          if gh release view "$TAG" --json isDraft --jq .isDraft > "$RUNNER_TEMP/release-is-draft"; then
            if [ "$(cat "$RUNNER_TEMP/release-is-draft")" != true ]; then
              echo 'This release is already published. Create a new version instead.' >&2
              exit 1
            fi
            gh release edit "$TAG" --notes-file dist/release-notes.md
            gh release upload "$TAG" dist/motogp-calendar-*.tar.gz dist/SHA256SUMS --clobber
          else
            flags=()
            if [[ "$TAG" == *-* ]]; then flags+=(--prerelease); fi
            gh release create "$TAG" dist/motogp-calendar-*.tar.gz dist/SHA256SUMS \
              --verify-tag --draft --title "MotoGP Calendar $TAG" \
              --notes-file dist/release-notes.md "${flags[@]}"
          fi
